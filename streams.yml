# Streams to watch. One entry per stream.
#   name      letters, numbers, . _ - only (used in folder and file names)
#   url       the YouTube live URL
#   lat, lon  where the camera is, in decimal degrees (used to work out daylight)
#   tz        the camera's timezone, e.g. America/Los_Angeles
#
# Snapshots are only taken while the sun is at least this many degrees above
# the horizon. Use -6 to include dawn and dusk.
min_sun_elevation: 0

